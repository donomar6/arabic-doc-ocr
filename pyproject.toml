[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-doc-ocr"
version = "0.2.0"
description = "Offline Arabic OCR for scanned documents: PP-OCR detection/recognition models and onnxruntime bundled in one wheel, no downloads."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Omar Hamdy" }]
keywords = ["ocr", "arabic", "offline", "onnxruntime", "paddleocr", "rapidocr", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Arabic",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
dependencies = [
    "numpy>=1.21",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://pypi.org/project/arabic-doc-ocr/"

[project.scripts]
arabic-ocr = "arabic_ocr.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["arabic_ocr*"]

[tool.setuptools.package-data]
"arabic_ocr" = [
    "models/*.onnx",
    "models/*.txt",
    "models/LICENSE",
    "_vendor/licenses/**/*",
    "_vendor/onnxruntime/*.txt",
    "_vendor/onnxruntime/*.md",
    "_vendor/onnxruntime/LICENSE",
    "_vendor/onnxruntime/capi/*.pyd",
    "_vendor/onnxruntime/capi/*.dll",
    "_vendor/onnxruntime/capi/*.so",
    "_vendor/onnxruntime/capi/*.so.*",
    "_vendor/onnxruntime/capi/*.dylib",
]
